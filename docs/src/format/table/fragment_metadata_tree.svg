<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 640 420"><title id="title">Fragment metadata tree</title><desc id="desc">A Version Manifest holds mutations_since_root and points at an external root. The root holds a buffer and routes fragment-id ranges to Lance leaves. Interior nodes may sit between the root and leaves.</desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M 0 1 L 10 5 L 0 9 Z" class="arrowhead"/></marker></defs><style>text{font-family:Helvetica,Arial,sans-serif;fill:#172a38}.rail,.title{font-weight:700}.rail{font-size:12px;fill:#526575}.title{font-size:16px}.sub{font-size:13px}.box{stroke:#afbcc7;stroke-width:1.2}.arrowhead{fill:#526575}.line{stroke:#526575;stroke-width:1.5}.manifest{fill:#deeef8}.mutation{fill:#fff0d5}.root{fill:#f5f8fa}.leaf{fill:#e3f2ea}@media (prefers-color-scheme:dark){text{fill:#e8eef4}.rail{fill:#9bb0c2}.box{stroke:#6c8ebf}.arrowhead{fill:#9bb0c2}.line{stroke:#9bb0c2}.manifest{fill:#1d293b}.mutation{fill:#3d3420}.root{fill:#1a222c}.leaf{fill:#1f2f1e}}</style><text x="16" y="48" class="rail">VERSION</text><text x="16" y="64" class="rail">MANIFEST</text><rect width="420" height="118" x="140" y="16" class="box manifest" rx="6"/><text x="156" y="42" class="title">Version Manifest</text><text x="156" y="62" class="sub">snapshot authority, schema, version</text><rect width="388" height="48" x="156" y="74" class="box mutation" rx="5"/><text x="172" y="94" class="title">mutations_since_root</text><text x="172" y="112" class="sub">not in the referenced root yet</text><line x1="350" x2="350" y1="134" y2="168" marker-end="url(#arrow)" class="line"/><text x="362" y="156" class="sub">root_uuid</text><text x="16" y="210" class="rail">EXTERNAL</text><text x="16" y="226" class="rail">ROOT</text><rect width="420" height="118" x="140" y="172" class="box root" rx="6"/><text x="156" y="198" class="title">Root R</text><text x="156" y="218" class="sub">child ranges</text><rect width="388" height="48" x="156" y="230" class="box mutation" rx="5"/><text x="172" y="250" class="title">buffer</text><text x="172" y="268" class="sub">in the tree, not in children or leaves yet</text><line x1="250" x2="210" y1="290" y2="332" marker-end="url(#arrow)" class="line"/><line x1="450" x2="490" y1="290" y2="332" marker-end="url(#arrow)" class="line"/><text x="292" y="318" class="sub">fragment-id ranges</text><text x="16" y="372" class="rail">LEAVES</text><rect width="200" height="72" x="80" y="336" class="box leaf" rx="6"/><text x="96" y="364" class="title">Lance leaf</text><text x="96" y="386" class="sub">fragments 0..999</text><rect width="200" height="72" x="360" y="336" class="box leaf" rx="6"/><text x="376" y="364" class="title">Lance leaf</text><text x="376" y="386" class="sub">fragments 1000..1999</text></svg>